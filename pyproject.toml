[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kg-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol server for querying a fake enterprise Account/Contact knowledge graph"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = ["mcp[cli]>=2.0.0", "rdflib>=7.0.0", "python-dotenv>=1.0.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
keywords = ["mcp", "knowledge-graph", "sparql", "rdf", "crm", "ai"]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "mypy>=1.0.0", "ruff>=0.1.0", "pytest-asyncio>=0.21", "pre-commit", "hatch"]

[tool.hatch.build]
include = ["src/kg_mcp_server/**/*.py", "README.md", ".env.example", "data/knowledge_graph.ttl"]

[tool.hatch.build.targets.wheel]
packages = ["src/kg_mcp_server"]

# Bundle the Turtle file inside the installed package (rather than relying on
# a path relative to the repo root) so it is still locatable after a
# non-editable `pip install .` — e.g. in the Docker image deployed to Render.
[tool.hatch.build.targets.wheel.force-include]
"data/knowledge_graph.ttl" = "kg_mcp_server/data/knowledge_graph.ttl"

[tool.hatch.envs.default.scripts]
test = "pytest -q"

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache", ".nox", ".pants.d",
    ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__", "_build", "buck-out",
    "build", "dist", "node_modules", "venv",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "C", "B"]
ignore = ["E501", "B008", "C901"]
fixable = ["A", "B", "C", "D", "E", "F"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
mccabe.max-complexity = 10

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
index-url = "https://pypi.org/simple"
