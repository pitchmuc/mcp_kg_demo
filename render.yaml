services:
  - type: web
    name: kg-mcp-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: FASTMCP_HOST
        value: 0.0.0.0
      # Render injects PORT automatically at runtime; the server reads it
      # directly (falling back to FASTMCP_PORT, then 8000). No need to set
      # PORT here — Render manages it.
      # Optional OAuth protection — uncomment and set to secure the endpoint.
      # - key: MCP_CLIENT_ID
      #   value: kg-mcp
      # - key: MCP_CLIENT_SECRET
      #   generateValue: true
      # - key: MCP_SERVER_URL
      #   value: https://kg-mcp-server.onrender.com
